<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard SIPELMAS RW06</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

header{
    background:#0B6E4F;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:25px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h2{
    margin:10px 0;
    color:#0B6E4F;
    font-size:36px;
}

.menu{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.menu a{
    text-decoration:none;
    background:#0B6E4F;
    color:white;
    padding:18px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.menu a:hover{
    background:#09543d;
}
</style>

</head>

<body>

<header>
<h1>🕌 SIPELMAS RW06</h1>
<p>Dashboard Pengaduan DKM RW 06</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>📨 Total Laporan</h3>
<h2 id="total">0</h2>
</div>

<div class="card">
<h3>🟡 Diproses</h3>
<h2 id="proses">0</h2>
</div>

<div class="card">
<h3>✅ Selesai</h3>
<h2 id="selesai">0</h2>
</div>

<div class="card">
<h3>❌ Ditolak</h3>
<h2 id="ditolak">0</h2>
</div>

</div>

<div class="menu">

<a href="index.html">🏠 Beranda</a>

<a href="laporan.html">📝 Buat Laporan</a>

<a href="#">🔍 Cek Status</a>

</div>

</div>

</body>
</html>
