<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Laporan - SIPELMAS RW06</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f4f4;
margin:0;
padding:0;
}

header{
background:#0B6E4F;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
max-width:700px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:150px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin-top:25px;
background:#0B6E4F;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#09543d;
}

.kembali{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#0B6E4F;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
margin-top:30px;
background:#ddd;
}

</style>

</head>

<body>

<header>

<h1>Portal Laporan DKM RW 06</h1>

<p>Silakan isi formulir berikut dengan lengkap.</p>

</header>

<div class="container">

<form id="laporanForm">

<label>Nama Pelapor</label>

<input type="text" placeholder="Masukkan nama">

<label>Nomor WhatsApp</label>

<input type="tel" placeholder="08xxxxxxxxxx">

<label>Jenis Laporan</label>

<select>

<option>Pilih Jenis Laporan</option>

<option>Kerusakan Fasilitas</option>

<option>Kehilangan Barang</option>

<option>Saran dan Masukan</option>

<option>Kebersihan Masjid</option>

<option>Keamanan</option>

<option>Lainnya</option>

</select>

<label>Judul Laporan</label>

<input type="text" placeholder="Judul laporan">

<label>Isi Laporan</label>

<textarea placeholder="Tuliskan laporan Anda di sini..."></textarea>

<label>Upload Foto</label>

<input type="file">

<button type="submit">

Kirim Laporan

</button>

</form>

<a class="kembali" href="index.html">

← Kembali ke Beranda

</a>

</div>

<footer>

© 2026 DKM RW 06

</footer>
  
<script>

document.getElementById("laporanForm").addEventListener("submit",function(e){

e.preventDefault();

fetch("https://script.google.com/macros/s/AKfycbxOpMYpXxS0ddnysJ9_72CIO1TSEzAY5l_I0Tnhqm0cpsJM0z00OJIUUXbgIKE-5MaC/exec",{

method:"POST",

body:JSON.stringify({

nama:document.querySelectorAll("input")[0].value,

wa:document.querySelectorAll("input")[1].value,

jenis:document.querySelector("select").value,

judul:document.querySelectorAll("input")[2].value,

isi:document.querySelector("textarea").value

})

})

.then(r=>r.text())

.then(data=>{

alert("Laporan berhasil dikirim.");

document.getElementById("laporanForm").reset();

});

});

</script>
  
</body>
</html>
